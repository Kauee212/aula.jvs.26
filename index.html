<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Web Studio</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonte moderna do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="calculator-card">
    <header class="card-header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="brand-title">Calculator</span>
    </header>

    <div class="display-container">
      <div id="previous-op" aria-live="polite"></div>
      <input type="text" id="display" readonly value="0" aria-label="Resultado">
    </div>
    
    <div class="buttons">
      <button class="btn btn-func" id="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn btn-func" onclick="toggleSign()">+/&minus;</button>
      <button class="btn btn-func" onclick="appendPercentage()">%</button>
      <button class="btn btn-op" onclick="appendOperator('/')">&divide;</button>

      <button class="btn" onclick="appendNumber('7')">7</button>
      <button class="btn" onclick="appendNumber('8')">8</button>
      <button class="btn" onclick="appendNumber('9')">9</button>
      <button class="btn btn-op" onclick="appendOperator('*')">&times;</button>

      <button class="btn" onclick="appendNumber('4')">4</button>
      <button class="btn" onclick="appendNumber('5')">5</button>
      <button class="btn" onclick="appendNumber('6')">6</button>
      <button class="btn btn-op" onclick="appendOperator('-')">&minus;</button>

      <button class="btn" onclick="appendNumber('1')">1</button>
      <button class="btn" onclick="appendNumber('2')">2</button>
      <button class="btn" onclick="appendNumber('3')">3</button>
      <button class="btn btn-op" onclick="appendOperator('+')">+</button>

      <button class="btn btn-zero" onclick="appendNumber('0')">0</button>
      <button class="btn" onclick="appendNumber('.')">,</button>
      <button class="btn btn-equal" onclick="calculate()">=</button>
    </div>

    <footer class="card-footer">
      <p>Desenvolvido com HTML, CSS & JS</p>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
